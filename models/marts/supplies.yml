models:
  - name: supplies
    description: 資材費データマート。資材コストごとに1行。
    columns:
      - name: supply_uuid
        description: 資材コストごとに一意となるキー。
        data_tests:
          - not_null
          - unique
      - name: supply_id
        description: 資材を識別するID。
      - name: product_id
        description: この資材が使用される商品を参照する外部キー。
        data_tests:
          - relationships:
              arguments:
                to: ref('products')
                field: product_id
      - name: supply_name
        description: 資材の名称。
      - name: supply_cost
        description: 資材のコスト(USD)。
      - name: is_perishable_supply
        description: この資材が傷みやすい(要冷蔵・要早期消費)ものかを示すブール値。
