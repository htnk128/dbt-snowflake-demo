name: dbt_snowflake_demo

profile: dbt_snowflake_demo

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  dbt_snowflake_demo:
    +schema: raw

models:
  dbt_snowflake_demo:
    +static_analysis: strict
    # Persist descriptions as COMMENTs on Snowflake tables/views and columns
    +persist_docs:
      relation: true
      columns: true
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
